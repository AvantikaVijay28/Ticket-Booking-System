<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking System</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="app">
      <div class="container">
        <header>
          <h1>Select Your Seats</h1>
          <p class="subtitle">Choose your perfect spot for the show</p>
        </header>

        <div class="stage-container">
          <div class="stage">STAGE</div>
        </div>

        <div class="seats-container">
          <div class="seat-row" data-row="A">
            <span class="row-label">A</span>
            <div class="seats"></div>
          </div>
          <div class="seat-row" data-row="B">
            <span class="row-label">B</span>
            <div class="seats"></div>
          </div>
          <div class="seat-row" data-row="C">
            <span class="row-label">C</span>
            <div class="seats"></div>
          </div>
          <div class="seat-row" data-row="D">
            <span class="row-label">D</span>
            <div class="seats"></div>
          </div>
          <div class="seat-row" data-row="E">
            <span class="row-label">E</span>
            <div class="seats"></div>
          </div>
          <div class="seat-row" data-row="F">
            <span class="row-label">F</span>
            <div class="seats"></div>
          </div>
          <div class="seat-row" data-row="G">
            <span class="row-label">G</span>
            <div class="seats"></div>
          </div>
          <div class="seat-row" data-row="H">
            <span class="row-label">H</span>
            <div class="seats"></div>
          </div>
        </div>

        <div class="legend">
          <div class="legend-item">
            <span class="seat-demo available"></span>
            <span>Available</span>
          </div>
          <div class="legend-item">
            <span class="seat-demo selected"></span>
            <span>Selected</span>
          </div>
          <div class="legend-item">
            <span class="seat-demo occupied"></span>
            <span>Occupied</span>
          </div>
        </div>

        <div class="booking-form">
          <h2>Booking Details</h2>
          <form id="bookingForm">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
            </div>
            <div class="form-group">
              <label for="selectedSeats">Selected Seats</label>
              <input type="text" id="selectedSeats" name="selectedSeats" readonly placeholder="No seats selected">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn" disabled>Book Seats</button>
          </form>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
